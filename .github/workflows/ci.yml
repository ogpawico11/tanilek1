name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tanszylek .
      - name: Smoke test (tryb DEMO)
        run: |
          docker run -d --name tsl -p 8000:8000 tanszylek
          for i in $(seq 1 40); do curl -fs localhost:8000/api/health && break; sleep 2; done
          curl -fs "localhost:8000/api/leki?q=metformin"
          curl -fs localhost:8000/api/meta
